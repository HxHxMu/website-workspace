<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product — LEBE</title>
  <meta name="description" content="" />
  <link rel="icon" href="./assets/images/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./output.css" />
</head>
<body class="bg-ink text-text font-sans">
<header class="site-header">
  <div class="container-shell flex items-center justify-between py-3">
    <a href="/" class="h-10 flex items-center">
      <img src="./assets/images/lebe-logo.svg" alt="LEBE" class="h-full w-auto">
    </a>

    <button
      id="menu-button"
      class="md:hidden inline-flex items-center justify-center rounded-md border border-text/15 px-3 py-2 text-sm"
      aria-expanded="false"
      aria-controls="mobile-menu"
      aria-label="Open site navigation">
      Menu
    </button>

    <nav class="hidden md:flex items-center gap-8 text-sm text-text-muted">
      <a href="/" class="hover:text-text transition-colors">Shop</a>
    </nav>
  </div>

  <nav id="mobile-menu" class="hidden border-t border-text/10 md:hidden">
    <div class="container-shell py-4 flex flex-col gap-3 text-sm">
      <a href="/" class="hover:text-text transition-colors">Shop</a>
    </div>
  </nav>
</header>
<main id="top">
  <section class="container-shell py-16 md:py-24">
    <div class="grid md:grid-cols-2 gap-12">
      <!-- Product Image -->
      <div class="flex items-center justify-center">
        <img id="product-image" src="" alt="" class="w-full aspect-square object-cover rounded bg-surface">
      </div>

      <!-- Product Info -->
      <div class="flex flex-col justify-start">
        <div class="mb-8">
          <h1 id="product-name" class="text-4xl md:text-5xl font-semibold tracking-tight mb-2"></h1>
          <p id="product-price" class="text-2xl font-semibold text-brand"></p>
        </div>

        <form id="product-form" class="space-y-6 mb-12">
          <!-- Color Swatches -->
          <div>
            <label class="block text-sm font-medium mb-3">Color</label>
            <div id="color-swatches" class="flex gap-3"></div>
          </div>

          <!-- Size -->
          <div>
            <label for="size-select" class="block text-sm font-medium mb-3">Size</label>
            <select id="size-select" class="w-full border border-text/20 rounded px-4 py-2 bg-surface text-text">
              <option value="">Select a size</option>
            </select>
          </div>

          <!-- Quantity -->
          <div>
            <label for="quantity" class="block text-sm font-medium mb-3">Quantity</label>
            <select id="quantity" class="w-full border border-text/20 rounded px-4 py-2 bg-surface text-text">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
            </select>
          </div>

          <!-- Buy Button -->
          <button type="button" id="buy-button" class="w-full btn-brand py-3 text-base font-semibold mt-8">
            Add to Cart
          </button>
        </form>

        <!-- Description -->
        <div class="border-t border-text/10 pt-8">
          <h2 class="text-sm font-medium uppercase tracking-widest mb-4">Details</h2>
          <p id="product-description" class="text-sm text-text-muted leading-relaxed"></p>
        </div>
      </div>
    </div>
  </section>
</main>
<footer class="border-t border-text/10">
  <div class="container-shell py-8 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 text-xs text-text-muted">
    <p>© LEBE 2026</p>
    <p>Tribal. Bold. Minimal.</p>
    <div class="flex gap-4">
      <a href="https://www.instagram.com/_lebe._/" target="_blank" rel="noopener noreferrer" class="hover:text-text transition-colors" aria-label="Instagram">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><circle cx="17.5" cy="6.5" r="1.5"></circle></svg>
      </a>
      <a href="https://www.facebook.com/lebe.yogawear" target="_blank" rel="noopener noreferrer" class="hover:text-text transition-colors" aria-label="Facebook">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 2h-3a6 6 0 0 0-6 6v3H7v4h2v8h4v-8h3l1-4h-4V8a2 2 0 0 1 2-2h1z"></path></svg>
      </a>
    </div>
  </div>
</footer>
<script src="js/main.js" defer></script>
<script src="js/cart.js" defer></script>
<script src="js/product.js" defer></script>
<script>
console.log('=== INLINE SCRIPT LOADED ===');

// Attach handlers synchronously, immediately
const buyBtn = document.getElementById('buy-button');
const form = document.getElementById('product-form');

console.log('Immediate check - Buy button:', !!buyBtn, 'Form:', !!form);

if (form) {
  form.addEventListener('submit', function(e) {
    console.log('>>> FORM SUBMIT <<<');
    e.preventDefault();
    e.stopPropagation();
    if (typeof handleBuyClick === 'function') handleBuyClick();
  }, true); // capture phase
  console.log('Form handler attached (capture phase)');
}

if (buyBtn) {
  buyBtn.addEventListener('click', function(e) {
    console.log('>>> BUTTON CLICK <<<');
    e.preventDefault();
    e.stopPropagation();
    if (typeof handleBuyClick === 'function') {
      handleBuyClick(e);
    }
    return false;
  }, true); // capture phase
  console.log('Button handler attached (capture phase)');
}
</script>
</body>
</html>
