<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <!-- Google tag (gtag.js) — production hosts only, keeps previews/localhost out of GA4 -->
  <script>
    (function () {
      var PROD_HOSTS = ['www.lebe.life', 'lebe.life'];
      if (PROD_HOSTS.indexOf(window.location.hostname) === -1) return;

      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      window.gtag = gtag;
      gtag('js', new Date());
      gtag('config', 'G-E8GJJV71XT');

      var gtagScript = document.createElement('script');
      gtagScript.async = true;
      gtagScript.src = 'https://www.googletagmanager.com/gtag/js?id=G-E8GJJV71XT';
      document.head.appendChild(gtagScript);
    })();
  </script>
  {{META_PIXEL_CODE}}
  {{PINTEREST_TAG_CODE}}
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  {{GOOGLE_SITE_VERIFICATION}}
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}" />
  <link rel="canonical" href="{{CANONICAL_URL}}" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="{{OG_TYPE}}" />
  <meta property="og:url" content="{{CANONICAL_URL}}" />
  <meta property="og:title" content="{{TITLE}}" />
  <meta property="og:description" content="{{DESCRIPTION}}" />
  <meta property="og:image" content="{{OG_IMAGE}}" />
  <meta property="og:site_name" content="LEBE" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="{{CANONICAL_URL}}" />
  <meta property="twitter:title" content="{{TITLE}}" />
  <meta property="twitter:description" content="{{DESCRIPTION}}" />
  <meta property="twitter:image" content="{{OG_IMAGE}}" />

  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="lebe." />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="stylesheet" href="/output.css" />
  {{EXTRA_HEAD}}
</head>
<body class="{{BODY_CLASS}}">
