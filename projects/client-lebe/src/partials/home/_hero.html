<main class="bg-[#e9e9e9] text-[#050505]">
  <!-- Hero Section -->
  <section class="relative flex min-h-screen items-end overflow-hidden bg-black text-white">
    <img src="./assets/images/lebeHero1.jpg" alt="LEBE campaign hero image"
      class="absolute inset-0 h-full w-full object-cover" />
    <div class="absolute inset-0 bg-gradient-to-t from-black/35 via-transparent to-black/10"></div>
    <div class="relative w-full pb-12 pt-32 md:pb-14">
      <div class="lebe-main-shell">
        <h1 class="font-serif text-[32px] lowercase leading-[0.92] text-[#ffffff] md:text-[64px]">saguanari.</h1>
      </div>
    </div>
  </section>

  <!-- Products Section -->
  <section class="lebe-main-shell px-0 py-20 md:py-28">
    <!-- Section Header -->
    <div class="mb-12 border-b border-[#050505] pb-5">
      <p class="lebe-kicker mb-3">made-to-order capsule</p>
      <h2 class="font-serif text-4xl tracking-[-0.04em] md:text-6xl">
        The edit.
      </h2>
    </div>

    <!-- Product Grid -->
    <div id="product-grid" class="grid gap-x-6 gap-y-14 grid-cols-1 md:grid-cols-2">
      <!-- Products will be populated by JavaScript -->
      <div class="animate-pulse">
        <div class="aspect-[4/5] bg-neutral-200 rounded"></div>
      </div>
      <div class="animate-pulse">
        <div class="aspect-[4/5] bg-neutral-200 rounded"></div>
      </div>
      <div class="animate-pulse">
        <div class="aspect-[4/5] bg-neutral-200 rounded"></div>
      </div>
      <div class="animate-pulse">
        <div class="aspect-[4/5] bg-neutral-200 rounded"></div>
      </div>
    </div>
  </section>
</main>

<script>
  (() => {
    const hero = document.querySelector('[data-random-hero]');
    if (!hero) return;

    const images = [
      './assets/images/lebeHero1.jpg',
      './assets/images/lebeHero2.jpg',
    ];
    hero.src = images[Math.floor(Math.random() * images.length)];
  })();
</script>
